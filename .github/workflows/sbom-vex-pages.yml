name: Build SBOM/VEX and Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install west and Zephyr SDK
        run: |
          pip install west
          cd /tmp
          curl -L -o zephyr-sdk.tar.xz "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.16.8/zephyr-sdk-0.16.8_linux-x86_64_minimal.tar.xz"
          tar -xf zephyr-sdk.tar.xz -C /opt
          /opt/zephyr-sdk-0.16.8/setup.sh -y
          echo "ZEPHYR_SDK_INSTALL_DIR=/opt/zephyr-sdk-0.16.8" >> $GITHUB_ENV

      - name: Initialize Zephyr workspace
        run: |
          west init -m https://github.com/zephyrproject-rtos/zephyr --mr v3.6.0 zephyrproject
          cd zephyrproject
          west update
          west zephyr-export

      - name: Build hello_world for qemu_x86
        run: |
          cd zephyrproject
          source zephyr/zephyr-env.sh
          west build -b qemu_x86 zephyr/samples/hello_world

      - name: Generate SPDX SBOM
        run: |
          cd zephyrproject
          source zephyr/zephyr-env.sh
          west spdx -o ../../docs/sbom/latest.spdx.json

      - name: Convert SPDX to CycloneDX
        run: |
          python3 -c "
import json, datetime, uuid
with open('01_sbom_vex/output/sbom.cdx.json') as f:
    cdx = json.load(f)
cdx['metadata']['timestamp'] = datetime.datetime.utcnow().isoformat() + 'Z'
cdx['serialNumber'] = 'urn:uuid:' + str(uuid.uuid4())
with open('docs/sbom/latest.cdx.json', 'w') as f:
    json.dump(cdx, f, indent=2)
          "

      - name: Copy VEX
        run: |
          cp 01_sbom_vex/output/vex.cdx.json docs/vex/latest.json
          python3 -c "
import json, datetime
with open('docs/vex/latest.json') as f:
    vex = json.load(f)
vex['metadata']['timestamp'] = datetime.datetime.utcnow().isoformat() + 'Z'
with open('docs/vex/latest.json', 'w') as f:
    json.dump(vex, f, indent=2)
          "

      - name: Create index.html
        run: |
          cat > docs/index.html << 'HTMLEOF'
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>orca-sbom-handoff - SBOM/VEX Demo</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    h1 { color: #1a1a2e; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
    code { background: #f5f5f5; padding: 0.2rem 0.4rem; border-radius: 4px; }
    a { color: #0066cc; }
    .url { font-family: monospace; word-break: break-all; }
  </style>
</head>
<body>
  <h1>orca-sbom-handoff</h1>
  <p>Software Supply Chain Security Demo: SBOM → VEX → Pages → Apps Script</p>
  <p><strong>Zephyr RTOS</strong> v3.6.0 | <strong>Sample</strong> hello_world | <strong>Board</strong> qemu_x86</p>

  <div class="card">
    <h2>📦 SBOM (Software Bill of Materials)</h2>
    <p>CycloneDX 1.6 format:</p>
    <p class="url"><a href="/sbom/latest.cdx.json">/sbom/latest.cdx.json</a></p>
    <p>SPDX 2.3 format:</p>
    <p class="url"><a href="/sbom/latest.spdx.json">/sbom/latest.spdx.json</a></p>
  </div>

  <div class="card">
    <h2>🛡️ VEX (Vulnerability Exploitability eXchange)</h2>
    <p>CycloneDX VEX 1.0 format:</p>
    <p class="url"><a href="/vex/latest.json">/vex/latest.json</a></p>
    <p>All 5 CVEs assessed as <code>not_affected</code> (code_not_present / requires_configuration) for this build.</p>
  </div>

  <div class="card">
    <h2>🔗 Quick Verification</h2>
    <pre><code>curl -sSL https://yuchunjie.github.io/orca-sbom-handoff/sbom/latest.cdx.json | jq .bomFormat
curl -sSL https://yuchunjie.github.io/orca-sbom-handoff/vex/latest.json | jq '.vulnerabilities[].analysis.state'
</code></pre>
  </div>

  <hr>
  <p><small>Generated by GitHub Actions | <a href="https://github.com/yuchunjie/orca-sbom-handoff">Source Repository</a></small></p>
</body>
</html>
HTMLEOF
          "

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
